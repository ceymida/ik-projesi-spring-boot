<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>İnsan Kaynakları Paneli</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">

    <!-- YENİ EKLENEN KISIM: ÇALIŞAN EKLEME FORMU -->
    <div class="row mb-4">
        <div class="col-md-10 offset-md-1">
            <div class="card shadow border-primary">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0">Yeni Çalışan Ekle</h5>
                </div>
                <div class="card-body">
                    <form id="yeniCalisanFormu">
                        <div class="row g-3">
                            <div class="col-md-4">
                                <input type="text" class="form-control" id="ad" placeholder="Ad" required>
                            </div>
                            <div class="col-md-4">
                                <input type="text" class="form-control" id="soyad" placeholder="Soyad" required>
                            </div>
                            <div class="col-md-4">
                                <input type="number" step="0.01" class="form-control" id="maas" placeholder="Maaş (Min: 17002)" required>
                            </div>
                            <div class="col-md-4">
                                <input type="text" class="form-control" id="departman" placeholder="Departman">
                            </div>
                            <div class="col-md-4">
                                <input type="text" class="form-control" id="unvan" placeholder="Ünvan">
                            </div>
                            <div class="col-md-4">
                                <input type="text" class="form-control" id="telefon" placeholder="Telefon">
                            </div>
                        </div>
                        <div class="mt-3 text-end">
                            <button type="submit" class="btn btn-success">Sisteme Kaydet</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- MEVCUT KISIM: ÇALIŞAN LİSTESİ (Güncellendi) -->
    <div class="row">
        <div class="col-md-10 offset-md-1">
            <h2 class="text-primary mb-4">Şirket Çalışan Listesi</h2>

            <div class="card shadow">
                <div class="card-body">
                    <table class="table table-hover table-bordered align-middle">
                        <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Ad Soyad</th>
                            <th>Departman</th>
                            <th>Ünvan</th>
                            <th>Telefon</th>
                            <th>Maaş (TL)</th>
                            <th class="text-center">İşlemler</th>
                        </tr>
                        </thead>
                        <tbody>
                        <!-- Tabloya yeni eklediğimiz özellikler (Departman, Unvan vs.) yansıtıldı -->
                        <tr th:each="calisan : ${calisanlar}">
                            <td th:text="${calisan.id}">1</td>
                            <td th:text="${calisan.ad} + ' ' + ${calisan.soyad}">Örnek Ad Soyad</td>
                            <td th:text="${calisan.departman}">IT</td>
                            <td th:text="${calisan.unvan}">Developer</td>
                            <td th:text="${calisan.telefon}">555...</td>
                            <td class="text-success fw-bold" th:text="${calisan.maas}">0.0</td>
                            <td class="text-center">
                                <!-- İzinler Butonu -->
                                <a th:href="@{/calisanlar/{id}/izinler(id=${calisan.id})}" class="btn btn-info btn-sm text-white">İzinler</a>

                                <!-- Silme Butonu -->
                                <button class="btn btn-danger btn-sm" th:onclick="'calisanSil(' + ${calisan.id} + ')'">Sil</button>
                                <!-- YENİ: Detay Butonu -->
                                <a th:href="@{/calisanlar/{id}/detay(id=${calisan.id})}" class="btn btn-primary btn-sm text-white">Detay</a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>
</div>

<!-- YENİ EKLENEN KISIM: API İLE HABERLEŞEN JAVASCRIPT KODLARI -->
<script>
    // 1. Yeni Çalışan Ekleme İşlemi
    document.getElementById('yeniCalisanFormu').addEventListener('submit', function(e) {
        e.preventDefault(); // Sayfanın yenilenmesini engelle

        // Formdaki verileri topla ve bir JSON objesi oluştur
        const calisanData = {
            ad: document.getElementById('ad').value,
            soyad: document.getElementById('soyad').value,
            maas: parseFloat(document.getElementById('maas').value),
            departman: document.getElementById('departman').value,
            unvan: document.getElementById('unvan').value,
            telefon: document.getElementById('telefon').value
        };

        // Arka uca (Backend API) POST isteği gönder
        fetch('/api/calisanlar', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(calisanData)
        })
            .then(response => {
                if(response.ok) {
                    alert("Çalışan başarıyla eklendi!");
                    window.location.reload(); // Değişiklikleri görmek için sayfayı yenile
                } else {
                    alert("Kayıt işlemi başarısız. Maaş kurallarını (Min 17002 TL) kontrol edin.");
                }
            })
            .catch(error => console.error('Hata:', error));
    });

    // 2. Çalışan Silme İşlemi
    function calisanSil(id) {
        if(confirm("Bu çalışanı silmek istediğinize emin misiniz?")) {
            // Arka uca DELETE isteği gönder
            fetch('/api/calisanlar/' + id, {
                method: 'DELETE'
            })
                .then(response => {
                    if(response.ok) {
                        alert("Çalışan sistemden silindi.");
                        window.location.reload();
                    } else {
                        alert("Silme işlemi başarısız oldu.");
                    }
                })
                .catch(error => console.error('Hata:', error));
        }
    }
</script>

</body>
</html>
