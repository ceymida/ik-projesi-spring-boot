<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>İnsan Kaynakları Paneli</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row">
        <div class="col-md-10 offset-md-1">
            <h2 class="text-primary mb-4">Şirket Çalışan Listesi</h2>

            <div class="card shadow">
                <div class="card-body">
                    <table class="table table-hover table-bordered">
                        <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Ad</th>
                            <th>Soyad</th>
                            <th>Maaş (TL)</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="calisan : ${calisanlar}">
                            <td th:text="${calisan.id}">1</td>
                            <td th:text="${calisan.ad}">Örnek Ad</td>
                            <td th:text="${calisan.soyad}">Örnek Soyad</td>
                            <td class="text-success fw-bold" th:text="${calisan.maas}">0.0</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>
</div>

</body>
</html>
