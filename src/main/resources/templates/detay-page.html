<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Çalışan Detayları</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">

    <!-- Başlık ve Geri Dönüş -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="text-primary">
            <span th:text="${calisan.ad} + ' ' + ${calisan.soyad}"></span> - Özlük Dosyası
        </h2>
        <a href="/calisanlar" class="btn btn-secondary">Listeye Dön</a>
    </div>

    <!-- Detay Güncelleme Formu -->
    <div class="card shadow border-primary">
        <div class="card-header bg-primary text-white">
            <h5 class="mb-0">Detaylı Bilgileri Güncelle</h5>
        </div>
        <div class="card-body">

            <form id="detayFormu">
                <!-- Arka plandaki PUT isteğinin çalışması için zorunlu olan mevcut bilgileri gizli tutuyoruz -->
                <input type="hidden" id="cId" th:value="${calisan.id}">
                <input type="hidden" id="ad" th:value="${calisan.ad}">
                <input type="hidden" id="soyad" th:value="${calisan.soyad}">
                <input type="hidden" id="maas" th:value="${calisan.maas}">
                <input type="hidden" id="departman" th:value="${calisan.departman}">
                <input type="hidden" id="unvan" th:value="${calisan.unvan}">
                <input type="hidden" id="telefon" th:value="${calisan.telefon}">

                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Mezun Olduğu Okul (API)</label>
                        <!-- İçini JS ile dolduracağız, mevcut veriyi th:data-selected ile tutuyoruz -->
                        <select class="form-select" id="okul" th:data-selected="${calisan.okul}">
                            <option value="">Üniversite Seçiliyor...</option>
                        </select>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label">Medeni Hal</label>
                        <select class="form-select" id="medeniHal">
                            <option value="Bekar" th:selected="${calisan.medeniHal == 'Bekar'}">Bekar</option>
                            <option value="Evli" th:selected="${calisan.medeniHal == 'Evli'}">Evli</option>
                        </select>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label">Ehliyet Sınıfı (API)</label>
                        <select class="form-select" id="ehliyet" th:data-selected="${calisan.ehliyet}">
                            <option value="">Yükleniyor...</option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">İşe Giriş Tarihi</label>
                        <input type="date" class="form-control" id="iseGirisTarihi" th:value="${calisan.iseGirisTarihi}">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">İşten Çıkış Tarihi</label>
                        <input type="date" class="form-control" id="istenCikisTarihi" th:value="${calisan.istenCikisTarihi}">
                    </div>
                </div>

                <div class="mt-4 text-end">
                    <button type="submit" class="btn btn-success">Bilgileri Kaydet</button>
                </div>
            </form>
        </div>
    </div>

</div>

<!-- JAVASCRIPT -->
<script>
    document.getElementById('detayFormu').addEventListener('submit', function(e) {
        e.preventDefault();

        const id = document.getElementById('cId').value;

        // Formdaki tüm verileri toplayıp JSON yapıyoruz (Eski veriler dahil)
        const detayData = {
            ad: document.getElementById('ad').value,
            soyad: document.getElementById('soyad').value,
            maas: parseFloat(document.getElementById('maas').value),
            departman: document.getElementById('departman').value,
            unvan: document.getElementById('unvan').value,
            telefon: document.getElementById('telefon').value,

            // Yeni Eklenenler
            okul: document.getElementById('okul').value,
            medeniHal: document.getElementById('medeniHal').value,
            ehliyet: document.getElementById('ehliyet').value,
            iseGirisTarihi: document.getElementById('iseGirisTarihi').value ? document.getElementById('iseGirisTarihi').value : null,
            istenCikisTarihi: document.getElementById('istenCikisTarihi').value ? document.getElementById('istenCikisTarihi').value : null
        };

        // Mevcut güncelleme (PUT) API'mize gönderiyoruz
        fetch('/api/calisanlar/' + id, {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(detayData)
        })
            .then(response => {
                if(response.ok) {
                    alert("Özlük bilgileri başarıyla güncellendi!");
                    window.location.reload();
                } else {
                    alert("Güncelleme işlemi başarısız oldu.");
                }
            })
            .catch(error => console.error('Hata:', error));
    });
    // SAYFA YÜKLENDİĞİNDE ÇALIŞACAK KODLAR
    document.addEventListener("DOMContentLoaded", function() {

        // 1. ÜNİVERSİTE VERİSİNİ KENDİ BACKEND APİ'MİZDEN ÇEKME
        // 1. ÜNİVERSİTE VERİSİNİ KENDİ BACKEND APİ'MİZDEN ÇEKME
        // 1. ÜNİVERSİTE VERİSİNİ KÜRESEL API'DEN ÇEKME (Proxy Korumalı)
        const okulSelect = document.getElementById("okul");
        const kayitliOkul = okulSelect.getAttribute("data-selected");

        // Asıl bağlanmak istediğimiz API adresi
        const apiUrl = "http://universities.hipolabs.com/search?country=Turkey";

        // Tarayıcı güvenlik (CORS) engellerine takılmamak için aracı bir proxy kullanıyoruz
        const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(apiUrl)}`;

        fetch(proxyUrl)
            .then(response => {
                if (!response.ok) {
                    throw new Error("Ağ bağlantısı başarısız oldu.");
                }
                return response.json(); // İlk çeviri: Proxy'den gelen cevabı JSON'a çevir
            })
            .then(proxyData => {
                // allorigins proxy'si veriyi "contents" adında bir metin olarak yollar.
                // JSON.parse ile bu metni gerçek bir JavaScript dizisine dönüştürüyoruz.
                const universiteListesi = JSON.parse(proxyData.contents);

                okulSelect.innerHTML = '<option value="">Seçiniz...</option>';

                // Gelen listeyi A'dan Z'ye alfabetik olarak sıralıyoruz
                universiteListesi.sort((a, b) => a.name.localeCompare(b.name));

                // Döngü: Listedeki her bir üniversite için HTML'e yeni bir <option> ekliyoruz
                universiteListesi.forEach(uni => {
                    const option = document.createElement("option");
                    option.value = uni.name;
                    option.textContent = uni.name;

                    // Eğer veritabanındaki okul ile API'deki eşleşirse, onu seçili yap
                    if (uni.name === kayitliOkul) {
                        option.selected = true;
                    }
                    okulSelect.appendChild(option);
                });
            })
            .catch(error => {
                console.error("API Çekme Hatası:", error);
                okulSelect.innerHTML = '<option value="">Okullar yüklenemedi!</option>';
            });

        // 2. KENDİ YAZDIĞIMIZ EHLİYET API'SİNDEN VERİ ÇEKME
        const ehliyetSelect = document.getElementById("ehliyet");
        const kayitliEhliyet = ehliyetSelect.getAttribute("data-selected");

        fetch("/api/calisanlar/ehliyet-siniflari")
            .then(response => response.json())
            .then(data => {
                ehliyetSelect.innerHTML = '<option value="">Seçiniz...</option>';

                data.forEach(sinif => {
                    const option = document.createElement("option");
                    option.value = sinif;
                    option.textContent = sinif;
                    if (sinif === kayitliEhliyet) {
                        option.selected = true;
                    }
                    ehliyetSelect.appendChild(option);
                });
            })
            .catch(error => console.error("Ehliyet API Hatası:", error));
    });
</script>

</body>
</html>
